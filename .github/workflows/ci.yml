name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --print-build-logs
